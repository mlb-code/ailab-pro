<body>
<header class="ihead">
  <a href="/" class="logo"><img src="/gem.png" class="gem" alt="">AI Lab <small>PRO</small></a>
  <nav id="ihnav" aria-label="חשבון"><a href="/">לאתר</a></nav>
</header>

<main class="main" id="app" aria-live="polite">
  <p class="muted">טוען…</p>
</main>

<!-- login -->
<template id="tpl-login">
  <span class="kicker">AI LAB PRO · שלב ראשון</span>
  <h1 class="t">שאלון הכרות עם הצרכים שלך.</h1>
  <p class="lead">זה השלב הראשון בעבודה עם AI Lab Pro, לפני מיפוי AI ולפני אפיון. לכל תהליך בעסק שאתה רוצה לשפר ממלאים שאלון קצר. אני, מאיר, עובר על התשובות לפני שאנחנו מדברים, כך שהשיחה הראשונה כבר ממוקדת.</p>
  <div class="card">
    <div id="oauthBox" class="oauth"></div>
    <div id="orLine" class="or" hidden>או עם קוד למייל</div>
    <form id="emailForm" novalidate>
      <div class="f">
        <label for="email">כתובת מייל</label>
        <input class="in ltr" type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="name@company.co.il" required>
      </div>
      <button class="btn acc block" type="submit" id="sendBtn">שלחו לי קוד כניסה</button>
    </form>
    <form id="codeForm" novalidate hidden>
      <p class="muted" id="codeSent"></p>
      <div class="f" style="margin-top:12px">
        <label for="code">הקוד מהמייל (6 ספרות)</label>
        <input class="in code" type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required>
      </div>
      <button class="btn acc block" type="submit" id="verifyBtn">כניסה</button>
      <div class="row" style="margin-top:14px">
        <button type="button" class="linkbtn" id="resendBtn">שליחת קוד חדש</button>
        <span class="spacer"></span>
        <button type="button" class="linkbtn" id="changeEmail">מייל אחר</button>
      </div>
      <p class="muted" style="margin-top:12px">לא הגיע? לבדוק בתיקיית הספאם או קידומי מכירות. המייל נשלח מהכתובת <span dir="ltr">pro@ai-lab.co.il</span>.</p>
    </form>
    <div id="loginMsg"></div>
  </div>
  <p class="muted" style="margin-top:18px">הפרטים והתשובות נשמרים אצל AI Lab Pro ומשמשים רק לבחינת הפרויקט שלך. אפשר לבקש מחיקה בכל זמן.</p>
</template>

<!-- profile -->
<template id="tpl-profile">
  <span class="kicker">STEP 0 · PROFILE</span>
  <h1 class="t" id="pTitle">נעים להכיר.</h1>
  <p class="lead" id="pLead">פעם אחת, כדי שאדע עם מי אני מדבר. אחר כך עוברים לשאלון.</p>
  <form id="profileForm" class="card" novalidate>
    <input type="text" name="company_url" id="hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="grid2" id="pFields"></div>
    <div id="profileMsg"></div>
    <div class="navbtns">
      <button type="button" class="btn ghost" id="pCancel" hidden>ביטול</button>
      <button type="submit" class="btn acc" id="pSave">שמירה והמשך</button>
    </div>
  </form>
</template>

<!-- dashboard -->
<template id="tpl-dash">
  <span class="kicker">YOUR PROCESSES</span>
  <h1 class="t" id="hello">שלום.</h1>
  <p class="lead">כל תהליך בעסק שרוצים לשפר = שאלון אחד. אפשר לשמור באמצע ולחזור אחר כך.</p>
  <div class="row" style="margin-bottom:22px">
    <button class="btn acc" id="newQ" type="button">שאלון חדש ←</button>
    <button class="btn ghost sm" id="editProfile" type="button">עריכת פרטים</button>
  </div>
  <div id="dashMsg"></div>
  <ul class="qlist" id="qlist"></ul>
</template>
